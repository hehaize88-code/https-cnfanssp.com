name: Install GA4 tag

on:
  push:
    branches:
      - "codex/add-ga4-tags-20260825"
    paths:
      - ".github/workflows/install-ga4-tags.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/add-ga4-tags-20260825
      - name: Add the tag to every HTML page
        shell: python
        run: |
          from pathlib import Path
          import re

          folder = "sheet-superbuy-net"
          measurement_id = "G-H4PY5G9L1M"
          root = Path(folder)
          if not root.is_dir():
              raise SystemExit(f"Missing site directory: {folder}")

          snippet = f"""<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id={measurement_id}"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){{dataLayer.push(arguments);}}
            gtag('js', new Date());
            gtag('config', '{measurement_id}');
          </script>"""
          head_re = re.compile(r"(<head(?:\s[^>]*)?>)", re.I)
          ga_re = re.compile(r"G-[A-Z0-9]{6,}")
          tagged = 0
          for page in root.rglob("*.html"):
              text = page.read_text(encoding="utf-8")
              if measurement_id in text:
                  tagged += 1
                  continue
              ids = set(ga_re.findall(text))
              if ids:
                  raise SystemExit(f"Unexpected GA ID in {page}: {sorted(ids)}")
              updated, count = head_re.subn(lambda m: m.group(1) + "\n" + snippet, text, count=1)
              if count:
                  page.write_text(updated, encoding="utf-8", newline="")
                  tagged += 1
          if not tagged:
              raise SystemExit("No HTML page was tagged")
      - name: Commit generated tracking tag
        shell: bash
        run: |
          git config user.name "hehaize88-code"
          git config user.email "hehaize88-code@users.noreply.github.com"
          git add -- sheet-superbuy-net
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add GA4 tracking tag for sheet-superbuy.net"
            git push origin HEAD:codex/add-ga4-tags-20260825
          fi
